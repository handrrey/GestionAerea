<div class="pantalla-completa">
  <div class="login-card">
    <div class="logo-icon">✈️</div>
    <h1 class="title">Gestión Aérea</h1>
    <p class="subtitle">Ingresa a tu cuenta para gestionar tus viajes</p>

    <!-- Alerta de error si falla la autenticación -->
    <div *ngIf="mensajeError" class="alerta-error">
      {{ mensajeError }}
    </div>

    <form (ngSubmit)="alIngresar()">
      <div class="form-group">
        <label for="user">Usuario o Correo electrónico</label>
        <input 
          type="text" 
          id="user" 
          [(ngModel)]="usuario" 
          name="usuario" 
          placeholder="ej. usuario@dominio.com" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="clave" 
          name="clave" 
          placeholder="••••••••" 
          required 
        />
      </div>

      <div class="options">
        <label><input type="checkbox" style="accent-color: var(--accent);"> Recordarme</label>
        <a routerLink="/recuperar-clave">¿Olvidaste tu clave?</a>
      </div>

      <button type="submit" class="btn-submit">INICIAR SESIÓN</button>
    </form>

    <p class="footer-text">
      ¿No tienes una cuenta? <a routerLink="/registro">Regístrate aquí</a>
    </p>
  </div>
</div>
