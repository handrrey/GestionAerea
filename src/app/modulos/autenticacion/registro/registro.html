<div class="pantalla-completa">
  <div class="register-card">
    <div class="header-text">
      <h1 class="title">Crea tu cuenta</h1>
      <p class="subtitle">Ingresa tus datos para comenzar a comprar y reservar tiquetes</p>
    </div>

    <!-- Alerta de Error -->
    <div *ngIf="mensajeError" class="alerta-error">
      {{ mensajeError }}
    </div>

    <form (ngSubmit)="alRegistrar()">
      <!-- Carga de Foto Opcional -->
      <div class="avatar-upload">
        <label for="avatar-input" class="avatar-circle">
          <img *ngIf="nuevoUsuario.imagenUrl" [src]="nuevoUsuario.imagenUrl" alt="Avatar" class="avatar-preview" />
          <span *ngIf="!nuevoUsuario.imagenUrl">📷</span>
        </label>
        <input 
          type="file" 
          id="avatar-input" 
          (change)="alSeleccionarImagen($event)" 
          accept="image/*" 
          style="display: none;" 
        />
        <span class="avatar-label">Subir imagen de perfil (Opcional)</span>
      </div>

      <!-- Formulario de 2 Columnas -->
      <div class="form-grid">
        <div class="form-group">
          <label for="cc">CC / Documento</label>
          <input 
            type="text" 
            id="cc" 
            [(ngModel)]="nuevoUsuario.cc" 
            name="cc" 
            placeholder="ej. 1098765432" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="names">Nombres</label>
          <input 
            type="text" 
            id="names" 
            [(ngModel)]="nuevoUsuario.nombres" 
            name="nombres" 
            placeholder="ej. Juan Carlos" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="surnames">Apellidos</label>
          <input 
            type="text" 
            id="surnames" 
            [(ngModel)]="nuevoUsuario.apellidos" 
            name="apellidos" 
            placeholder="ej. Pérez Gómez" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="birthdate">Fecha de Nacimiento</label>
          <input 
            type="date" 
            [(ngModel)]="nuevoUsuario.fechaNacimiento" 
            name="fechaNacimiento" 
            id="fechaNacimiento"
            [min]="fechaMinima" 
            [max]="fechaMaxima" 
            required
          >
        </div>

        <div class="form-group">
          <label for="birthplace">Lugar de Nacimiento</label>
          <input 
            type="text" 
            id="birthplace" 
            [(ngModel)]="nuevoUsuario.lugarNacimiento" 
            name="lugarNacimiento" 
            placeholder="ej. Pereira" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="gender">Género</label>
          <select 
            id="gender" 
            [(ngModel)]="nuevoUsuario.genero" 
            name="genero" 
            required
          >
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
          </select>
        </div>

        <div class="form-group">
          <label for="address">Dirección de Facturación</label>
          <input 
            type="text" 
            id="address" 
            [(ngModel)]="nuevoUsuario.direccionFacturacion" 
            name="direccionFacturacion" 
            placeholder="ej. Cra 10 # 15-20" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input 
            type="email" 
            id="email"
            [(ngModel)]="nuevoUsuario.email"
            name="email"
            placeholder="ej. usuario@dominio.com" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="usuario">Nombre de Usuario</label>
          <input 
            type="text" 
            id="usuario" 
            [(ngModel)]="nuevoUsuario.usuario" 
            name="usuario" 
            placeholder="ej. jperez" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="nuevoUsuario.password" 
            name="password" 
            placeholder="••••••••" 
            required 
          />
        </div>

        <!-- Casilla de Suscripción "
        <div class="form-group full-width">
          <div class="checkbox-group">
            <input 
              type="checkbox" 
              id="news" 
              [(ngModel)]="nuevoUsuario.suscritoNoticias"
              name="suscritoNoticias" 
              style="accent-color: var(--accent);" 
            />
            <label for="news" style="margin: 0; font-weight: 500;">
              Deseo suscribirme al sistema de noticias y promociones
            </label>
          </div>
        </div> -->

        <!-- Botón de Registro -->
        <div class="form-group full-width">
          <button type="submit" class="btn-submit">CREAR MI CUENTA</button>
        </div>
      </div>
    </form>

    <p class="footer-text">
      ¿Ya tienes una cuenta? <a routerLink="/inicio-sesion">Inicia sesión aquí</a>
    </p>
  </div>
</div>
